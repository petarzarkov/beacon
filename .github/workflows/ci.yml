name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

      - name: Test
        run: bun run test

      # Proves the agent still compiles to a single executable, which is the one
      # thing about this repo that a normal typecheck cannot tell you.
      - name: Build the agent
        run: bun run build:agent
