name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

      - name: Test
        run: bun run test

      # Proves the agent still compiles to a single executable, which is the one
      # thing about this repo that a normal typecheck cannot tell you. Ahead of
      # the e2e suite because that serves this binary as a published release.
      - name: Build the agent
        run: bun run build:agent

      # The console is part of the deploy: it builds into the panel's public dir,
      # and the SPA-serving e2e checks depend on it being there.
      - name: Build the console
        run: bun run build:fe

      # The console e2e drives a real browser against the built SPA. Without a
      # Chromium those tests skip themselves rather than fail; installing one
      # here is what makes CI actually run them. `--with-deps` pulls the system
      # libraries a headless browser needs on the runner.
      - name: Install a browser for the console e2e
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      # A real panel and real agent processes, end to end: enrolment, the command
      # lifecycle including a live restart, self-update swapping the binary in
      # place, release distribution, discovery, deployment, and the console -
      # driven in a real browser. Last, because it is the slowest and depends on
      # both builds and the browser.
      - name: End-to-end
        run: bun run test:e2e
